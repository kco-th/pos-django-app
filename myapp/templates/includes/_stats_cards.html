<div class="row g-3 mb-4">
    <!-- Total Revenue section -->
    <div class="col-12 col-sm-6 col-xl-4">
        <div class="card border-0 shadow-sm p-3">
            <div class="d-flex align-items-center">
                <div class="p-3 bg-primary bg-opacity-10 text-primary rounded-3 me-3">
                    <i class="bi bi-currency-dollar fs-3"></i>
                </div>
                <div>
                    <h6 class="text-muted mb-1">Total Revenue</h6>
                    <h4 class="mb-0 fw-bold">${{ total_revenue|floatformat:2 }}</h4>
                </div>
            </div>
        </div>
    </div>

    <!-- Total Orders section -->
    <div class="col-12 col-sm-6 col-xl-4">
        <div class="card border-0 shadow-sm p-3">
            <div class="d-flex align-items-center">
                <div class="p-3 bg-success bg-opacity-10 text-success rounded-3 me-3">
                    <i class="bi bi-cart-check fs-3"></i>
                </div>
                <div>
                    <h6 class="text-muted mb-1">Total Orders</h6>
                    <h4 class="mb-0 fw-bold">{{ total_orders }}</h4>
                </div>
            </div>
        </div>
    </div>

    <!-- Low Stock section -->
    <div class="col-12 col-sm-6 col-xl-4">
        <div class="card border-0 shadow-sm p-3">
            <div class="d-flex align-items-center">
                <div class="p-3 bg-warning bg-opacity-10 text-warning rounded-3 me-3">
                    <i class="bi bi-exclamation-triangle fs-3"></i>
                </div>
                <div>
                    <h6 class="text-muted mb-1">Low Stock</h6>
                    <h4 class="mb-0 fw-bold text-danger">{{ low_stock_count }}</h4>
                </div>
            </div>
        </div>
    </div>
</div>
