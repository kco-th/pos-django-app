 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS - Detail Sale</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .table-responsive {
            max-height: 480px;
            overflow-y: auto;
        }
    </style>
</head>
<body class="bg-light">
<div class="container-fluid py-4">
    <div class="row">
        <!-- Left Column: Item Scanning & Cart Items -->
        <div class="col-lg-8">
            <div class="card shadow-sm border-0 mb-3">
                <div class="card-body">
                    <div class="input-group input-group-lg mb-3">
                        <span class="input-group-text bg-primary text-white font-monospace">Item Code / ID</span>
                        <input type="text" id="itemCodeInput" class="form-control" placeholder="Scan or enter item code and press Enter..." autofocus autocomplete="off">
                    </div>
                    <div id="errorAlert" class="alert alert-danger d-none py-2" role="alert"></div>

                    <div class="table-responsive">
                        <table class="table table-hover align-middle" id="cartTable">
                            <thead class="table-dark">
                                <tr>
                                    <th>Item Code</th>
                                    <th>Description / Name</th>
                                    <th class="text-end">Unit Price</th>
                                    <th class="text-center" style="width: 140px;">Quantity</th>
                                    <th class="text-end">Subtotal</th>
                                    <th class="text-center" style="width: 100px;">Action</th>
                                </tr>
                            </thead>
                            <tbody id="cartBody">
                                <!-- Cart rows will be appended here -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Column: Checkout & Payment Summary -->
        <div class="col-lg-4">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-dark text-white py-3">
                    <h5 class="card-title mb-0 text-center">Payment Summary</h5>
                </div>
                <div class="card-body p-4">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <span class="fs-5 text-muted">Total Amount:</span>
                        <span class="fs-3 fw-bold text-primary" id="grandTotal">0.00</span>
                    </div>
                    
                    <div class="mb-3">
                        <label for="cashReceived" class="form-label fw-semibold">Cash Received</label>
                        <input type="number" step="0.01" id="cashReceived" class="form-control form-control-lg text-end" placeholder="0.00">
                    </div>

                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <span class="fs-5 text-muted">Change:</span>
                        <span class="fs-4 fw-bold text-success" id="changeAmount">0.00</span>
                    </div>

                    <button class="btn btn-success btn-lg w-100 py-3 fw-bold shadow-sm" onclick="processCheckout()">
                        Complete Sale
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
 
<script>
let cart = {};

// Listen for Enter key press on Item Code input
document.getElementById('itemCodeInput').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
        const code = this.value.trim();
       
        if (!code) return;

        fetch(`/pos/get-product/?code=${encodeURIComponent(code)}`)
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    addProductToCart(data.product);
                    clearAlert();
                    document.getElementById('itemCodeInput').value = '';
                } else {
                    showAlert(data.message || 'Product not found');
                }
            })
            .catch(() => showAlert('Network error or server unreachable'));
    }
});

function showAlert(message) {
    const alertBox = document.getElementById('errorAlert');
    alertBox.innerText = message;
    alertBox.classList.remove('d-none');
}

function clearAlert() {
    const alertBox = document.getElementById('errorAlert');
    alertBox.innerText = '';
    alertBox.classList.add('d-none');
}

function addProductToCart(product) {
//check product is already in cart
    if (cart[product.id]) {
        // product.stock is database balance
        if (cart[product.id].quantity < product.stock) {
            cart[product.id].quantity += 1;
        } else {
            showAlert(`Cannot add more. Available stock limit reached (${product.stock})`);
            return;
        }
    } 
    //if product is not already in cart
    else {
        cart[product.id] = {
            id: product.id,
            name: product.name,
            price: parseFloat(product.price),
            stock: product.stock,
            quantity: 1
        };
    }
    renderCart();
}

function updateQuantity(id, qty) {
    qty = parseInt(qty);
    if (isNaN(qty) || qty <= 0) {
        delete cart[id];
    } else if (qty > cart[id].stock) {
        showAlert(`Exceeded stock limit. Max available: ${cart[id].stock}`);
        cart[id].quantity = cart[id].stock;
    } else {
        cart[id].quantity = qty;
    }
    renderCart();
}

function removeItem(id) {
    delete cart[id];
    renderCart();
}
//add data to cart
function renderCart() {
    const tbody = document.getElementById('cartBody');
    tbody.innerHTML = '';
    let grandTotal = 0;

    const items = Object.values(cart);
    if (items.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-4">No items added yet</td></tr>';
    } else {
        items.forEach(item => {
            const subtotal = item.price * item.quantity;
            grandTotal += subtotal;

            tbody.innerHTML += `
                <tr>
                    <td class="font-monospace">${item.id}</td>
                    <td><strong>${item.name}</strong></td>
                    <td class="text-end">${item.price.toFixed(2)}</td>
                    <td class="text-center">
                        <input type="number" class="form-control form-control-sm text-center" 
                               value="${item.quantity}" min="1" max="${item.stock}" 
                               onchange="updateQuantity(${item.id}, this.value)">
                    </td>
                    <td class="text-end fw-semibold">${subtotal.toFixed(2)}</td>
                    <td class="text-center">
                        <button class="btn btn-sm btn-outline-danger" onclick="removeItem(${item.id})">Remove</button>
                    </td>
                </tr>
            `;
        });
    }

    document.getElementById('grandTotal').innerText = grandTotal.toFixed(2);
    calculateChange();
}

document.getElementById('cashReceived').addEventListener('input', calculateChange);

function calculateChange() {
    const grandTotal = Object.values(cart).reduce((sum, item) => sum + (item.price * item.quantity), 0);
    //const grandTotal =parseFloat(document.getElementById('grandTotal').value)
    const cash = parseFloat(document.getElementById('cashReceived').value) || 0;
    const change = cash - grandTotal;

    const changeElem = document.getElementById('changeAmount');
    if (change >= 0 && grandTotal > 0) {
        changeElem.innerText = change.toFixed(2);
        changeElem.className = 'fs-4 fw-bold text-success';
    } else {
        changeElem.innerText = '0.00';
        changeElem.className = 'fs-4 fw-bold text-muted';
    }
}

function processCheckout() {
    const items = Object.values(cart);//purchase cart items
    const cash = parseFloat(document.getElementById('cashReceived').value) || 0;
    const grandTotal = items.reduce((sum, item) => sum + (item.price * item.quantity), 0);

    if (items.length === 0) {
        showAlert('Cart is empty. Please add products first.');
        return;
    }

    fetch('/pos/checkout/', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': '{{ csrf_token }}'
        },
        body: JSON.stringify({ items: items, cash_received: cash })
    })
    .then(res => res.json())
    .then(data => {
        if (data.success) {
            alert(`Sale Completed Successfully!\nSale ID: #${data.sale_id}\nTotal: ${data.total_amount}\nChange: ${data.change}`);
            cart = {};
            document.getElementById('cashReceived').value = '';
            clearAlert();
            renderCart();
            document.getElementById('itemCodeInput').focus();
        } else {
            showAlert(data.message || 'Checkout failed.');
        }
    })
    .catch(() => showAlert('Failed to process sale request.'));
}

// Initial render
renderCart();
</script>
 

</body>
</html>
