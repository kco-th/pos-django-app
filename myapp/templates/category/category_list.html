{% extends 'includes/sidebar.html' %}
{% load static %}
{% block content %}
<h2>Category List</h2>
<a href="{% url 'myapp:category_create' %}">+ Create New Category</a>

<table border="1" style="margin-top: 10px; width: 100%;">
  <tr>
    <th>Name</th>
    <th>Description</th>
    <th>Actions</th>
  </tr>
  {% for category in categories %}
  <tr>
    <td>{{ category.name }}</a></td>
    <td>{{category.description }}</td>
   
    <td>
      <a href="{% url 'myapp:category_update' category.pk %}">Edit</a> |
      <a href="{% url 'myapp:category_delete' category.pk %}">Delete</a>
    </td>
  </tr>
  {% empty %}
  <tr>
    <td colspan="5">No category available.</td>
  </tr>
  {% endfor %}
</table>
{% endblock %}
