{% extends 'includes/sidebar.html' %}
{% load static %}
{% block content %}

<div style="margin-bottom: 1rem;">
      <label style="display: block; font-size: 0.875rem; margin-bottom: 0.3rem; color: #374151;">(Username)</label>
      <input type="text" name="username" required autofocus autocomplete="off" style="width: 100%; box-sizing: border-box; padding: 0.6rem; border: 1px solid #d1d5db; border-radius: 4px; font-size: 0.9rem;">
    </div>

    <div style="margin-bottom: 1rem;">
      <label style="display: block; font-size: 0.875rem; margin-bottom: 0.3rem; color: #374151;">Email</label>
      <input type="email" name="email" required autocomplete="off" style="width: 100%; box-sizing: border-box; padding: 0.6rem; border: 1px solid #d1d5db; border-radius: 4px; font-size: 0.9rem;">
    </div>

    <div style="margin-bottom: 1rem;">
      <label style="display: block; font-size: 0.875rem; margin-bottom: 0.3rem; color: #374151;">Password</label>
      <input type="password" name="password1" required style="width: 100%; box-sizing: border-box; padding: 0.6rem; border: 1px solid #d1d5db; border-radius: 4px; font-size: 0.9rem;">
    </div>

    <div style="margin-bottom: 1.5rem;">
      <label style="display: block; font-size: 0.875rem; margin-bottom: 0.3rem; color: #374151;">Confirm Password</label>
      <input type="password" name="password2" required style="width: 100%; box-sizing: border-box; padding: 0.6rem; border: 1px solid #d1d5db; border-radius: 4px; font-size: 0.9rem;">
    </div>
    <div style="margin-bottom: 1.5rem;">
      <label style="display: block; font-size: 0.875rem; margin-bottom: 0.3rem; color: #374151;">User Role</label>
      <input type="text" name="userrole" required style="width: 100%; box-sizing: border-box; padding: 0.6rem; border: 1px solid #d1d5db; border-radius: 4px; font-size: 0.9rem;">
    </div>

    <button type="submit" style="width: 100%; padding: 0.7rem; background-color: #1f2937; color: white; border: none; border-radius: 4px; font-weight: 600; cursor: pointer; font-size: 0.95rem;">
      Register  
    </button>
  </form>

  <p style="text-align: center; margin-top: 1.5rem; font-size: 0.875rem; color: #6b7280;">
    Already have an account? <a href="{% url 'myapp:login' %}" style="color: #2563eb; text-decoration: none; font-weight: 500;">Login </a>
  </p>
</div>
{% endblock %}
